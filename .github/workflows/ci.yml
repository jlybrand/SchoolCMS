name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Node LTS line — see .nvmrc. Node 20 is EOL; Node 24 (Krypton) is Active LTS.
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '11.20.0'

jobs:
  # Every job carries `timeout-minutes`. GitHub's default is 360, so a step that hangs
  # rather than fails — `playwright install --with-deps` waiting on an unreachable apt
  # mirror is the one we hit — blocks the branch for six hours and burns a runner the
  # whole time. Every job here runs in under 2.5 minutes; these limits are five to eight
  # times that, which is headroom for a cold cache and still fails a hang in minutes.
  #
  # Gate order per `06` §3 — fail fast:
  # typecheck -> lint -> unit -> integration -> build -> e2e smoke -> axe -> lighthouse
  # The component axe gate runs alongside e2e: it needs neither a database nor a Next build,
  # so there is nothing to gain by making it wait for one.
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated artifacts are current
        # payload-types.ts and importMap.js are committed so typecheck and build need no
        # codegen step, and schema changes show up in review. Regenerating here proves the
        # committed copies match the config:
        #   - a stale types file lets a breaking field change typecheck clean
        #   - a stale import map builds fine and then fails at RUNTIME, when the admin
        #     cannot resolve a component it was told exists
        run: |
          pnpm run generate:types
          pnpm run generate:importmap
          git diff --exit-code src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint (includes both Phase 0 guardrails)
        run: pnpm run lint

  test:
    name: unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dd2
          POSTGRES_PASSWORD: dd2_ci
          POSTGRES_DB: dd2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dd2 -d dd2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://dd2:dd2_ci@localhost:5432/dd2_test
      # tests/setup/env.ts reads THIS, not DATABASE_URI, and overwrites DATABASE_URI with
      # it before the Payload config is evaluated. It deliberately refuses to inherit an
      # ambient DATABASE_URI, so that a local `pnpm test` can never point the isolation
      # suite — which truncates collections between runs — at a developer's dev database.
      # An environment that wants the integration tests to reach a database has to say so
      # explicitly, which is what this line does.
      TEST_DATABASE_URI: postgres://dd2:dd2_ci@localhost:5432/dd2_test
      PAYLOAD_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (includes the guardrail suites)
        run: pnpm run test:unit
      - name: Integration tests
        # Includes the adversarial cross-tenant suite, which is the primary isolation
        # guarantee (`03` §6.4, `06` §2.2) rather than a secondary check. If this step is
        # not reaching Postgres, that guarantee is unenforced — it must fail loudly, never
        # be skipped.
        run: pnpm run test:integration

  components:
    name: component axe gate (Storybook, LTR + RTL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test
    # No Postgres and no Next build: Storybook renders components in isolation. Keeping this
    # job independent of the database means a component regression is diagnosable on its own,
    # and it keeps working through phases where the page templates are still changing shape.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: axe over every story, both directions (zero critical/serious to merge)
        # `06` §2.4 — every block registers its axe test in the same PR. Driven from
        # Storybook's story index, so a new story is in the gate the moment it exists.
        run: pnpm run test:a11y:components
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-components
          path: playwright-report/
          retention-days: 7

  e2e:
    name: build + e2e smoke + axe gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: test
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dd2
          POSTGRES_PASSWORD: dd2_ci
          POSTGRES_DB: dd2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dd2 -d dd2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://dd2:dd2_ci@localhost:5432/dd2_test
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      # The admin plane needs a real session from Phase 3's paste normalizer onward, and
      # `scripts/seed.ts` creates no admin unless BOTH of these are set. That policy is not
      # relaxed here: no credential is committed for anyone to reuse, CI states its own.
      #
      # Inline rather than a repository secret, matching PAYLOAD_SECRET above and for the
      # same reason. This pair authenticates against a Postgres service container that is
      # created for this job and destroyed with the runner, is never reachable off it, and
      # grants nothing anywhere else. Putting it in the secret store would imply it guards
      # something, and would silently break CI on every fork.
      #
      # NOT a template for any deployed environment: real environments hold real staff
      # accounts and their secrets live in the platform secret store (`09` §1).
      #
      # The password must satisfy src/auth/password-policy.ts — 8+ characters, no banned
      # fragment ("admin", "district", "dd2", "password", ...) — or the seed step throws.
      SEED_ADMIN_EMAIL: ci-e2e@example.invalid
      SEED_ADMIN_PASSWORD: ci-ephemeral-runner-phrase
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
      - name: Seed tenants + the CI district admin
        # The public site resolves a tenant from the request Host and 404s an unknown one
        # by design (`02` §4.1), so without seeded tenants there is nothing to serve — the
        # server would not even pass Playwright's readiness check. `*.localhost` hostnames
        # resolve to loopback with no /etc/hosts entry (`06` §4).
        #
        # This is also the first time the admin path of the seed runs in CI. The admin-plane
        # specs fail rather than skip when the credentials are absent here
        # (tests/e2e/support/admin-session.ts) — a gate that silently stops covering the
        # admin plane while still reporting green is the failure mode being avoided.
        run: pnpm run seed
      - name: E2E smoke + axe gate (zero critical/serious to merge)
        run: pnpm run test:e2e:smoke
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: e2e
    # Postgres and the seed step mirror the `e2e` job above, and for the same reason: the
    # public site resolves a tenant from the request Host and 404s an unknown one by design
    # (`02` §4.1). Without them `lhci` audited a 404 rendered outside `SiteLayout` — no
    # `<html lang>`, no page content — so the `07` §7 budget scored a page the site never
    # serves and had never measured the real thing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dd2
          POSTGRES_PASSWORD: dd2_ci
          POSTGRES_DB: dd2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dd2 -d dd2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://dd2:dd2_ci@localhost:5432/dd2_test
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - name: Seed tenants
        # `lighthouserc.json` audits `http://localhost:3000/`, and bare `localhost` is the
        # district tenant in the seed set. `lhci` starts the server itself, so this has to
        # land before `test:perf`, not inside it.
        run: pnpm run seed
      - name: Core Web Vitals + a11y budget
        run: pnpm run test:perf
      # The report stays inside the repo's access control. `lhci`'s default upload target is
      # Google's temporary PUBLIC storage — an unlisted but world-readable URL — which was
      # harmless for seeded content and would not be once real pages are audited.
      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/reports/
          retention-days: 14
          if-no-files-found: ignore

  # Dependency scanning per `06` §2.7. Payload version bumps are always a deliberate,
  # separate PR — never bundled with feature work (`09` §2).
  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
