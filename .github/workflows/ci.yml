name: CI

# A change that is only prose — docs, the design suite, any Markdown — runs nothing: no job here
# reads it. A PR that mixes prose with anything else runs in full (`paths-ignore` skips a run only
# when EVERY changed file matches). There is no branch protection with required checks, so a run
# that never starts blocks nothing.
#
# ACTIONS MINUTES (Jason, 2026-11-17: the plan's minutes were nearly gone). Measured over 40 runs,
# a run billed ~30 minutes, and pushes to main were 48% of the total: every merge re-ran the whole
# suite its PR had just passed. So:
#   - a PULL REQUEST runs everything, as before;
#   - a DRAFT pull request runs nothing — mark it ready for review to run CI;
#   - a PUSH TO MAIN runs typecheck + lint and unit + integration only (the isolation suite stays
#     on main). E2E, the Storybook axe gate and Lighthouse ran on the PR;
#   - the DEPENDENCY AUDIT runs when the lockfile can have changed, and weekly on its own.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore: ['docs/**', 'starterDocs/**', '**/*.md']
  push:
    branches: [main]
    paths-ignore: ['docs/**', 'starterDocs/**', '**/*.md']
  schedule:
    # Mondays, 11:00 UTC: the audit alone. A new advisory against an unchanged lockfile shows up
    # here within a week, without a full run on every merge.
    - cron: '0 11 * * 1'

concurrency:
  # The event is in the group so the weekly audit and a push to main never cancel each other.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned Node LTS line — see .nvmrc. Node 20 is EOL; Node 24 (Krypton) is Active LTS.
  NODE_VERSION: '24.19.0'
  PNPM_VERSION: '11.20.0'

jobs:
  # Which of the slower, narrower gates a PR can touch. Each list below is what a gate CANNOT be
  # affected by — a SKIP list, not a run list — so a file in a directory nobody listed runs the
  # gate. A push to main runs everything.
  #
  #   components  the Storybook axe gate renders components in isolation; the admin, the
  #               collections, access, the content layer and tests other than its own cannot
  #               change a story.
  #   public      Lighthouse audits the public home page (`lighthouserc.json`); the admin planes
  #               (`src/admin`, `(payload)`, `(preview)`) and tests cannot change it.
  #   deps        the dependency audit reads only the lockfile.
  #
  # A push to main runs none of the three (the PR did); the weekly schedule runs the audit only.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    outputs:
      components: ${{ steps.filter.outputs.components }}
      public: ${{ steps.filter.outputs.public }}
      deps: ${{ steps.filter.outputs.deps }}
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0 }
      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
        run: |
          if [ "$EVENT" = "schedule" ]; then
            printf 'components=false\npublic=false\ndeps=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$EVENT" != "pull_request" ]; then
            printf 'components=false\npublic=false\ndeps=false\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          files=$(git diff --name-only "origin/$BASE...HEAD")
          printf 'Changed:\n%s\n' "$files"

          components=false; public=false; deps=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              package.json|pnpm-lock.yaml|pnpm-workspace.yaml|.npmrc|.nvmrc|.github/*)
                deps=true; components=true; public=true; continue ;;
            esac
            case "$f" in
              src/admin/*|src/app/*|src/access/*|src/auth/*|src/collections/*|src/content/*|\
              src/jobs/*|src/payload.config.ts|src/payload-types.ts|migrations/*|scripts/*|\
              tests/e2e/*|tests/unit/*|tests/integration/*|tests/helpers/*|tests/setup/*|\
              playwright.config.ts|lighthouserc.json) ;;
              *) components=true ;;
            esac
            case "$f" in
              src/admin/*|'src/app/(payload)/'*|'src/app/(preview)/'*|tests/*|.storybook/*|\
              *.stories.tsx|playwright.config.ts|playwright.storybook.config.ts) ;;
              *) public=true ;;
            esac
          done <<< "$files"
          printf 'components=%s\npublic=%s\ndeps=%s\n' "$components" "$public" "$deps" | tee -a "$GITHUB_OUTPUT"

  # Every job carries `timeout-minutes`. GitHub's default is 360, so a step that hangs
  # rather than fails — `playwright install --with-deps` waiting on an unreachable apt
  # mirror is the one we hit — blocks the branch for six hours and burns a runner the
  # whole time. Every job here runs in under 2.5 minutes; these limits are five to eight
  # times that, which is headroom for a cold cache and still fails a hang in minutes.
  #
  # Gate order per `06` §3 — fail fast:
  # typecheck -> lint -> unit -> integration -> build -> e2e -> axe -> lighthouse
  # The component axe gate runs alongside e2e: it needs neither a database nor a Next build,
  # so there is nothing to gain by making it wait for one.
  static:
    name: typecheck + lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Not on the weekly audit, and not on a draft. Every other test job waits on this one, so
    # skipping it skips them.
    if: >-
      github.event_name != 'schedule' &&
      (github.event_name != 'pull_request' || !github.event.pull_request.draft)
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Generated artifacts are current
        # payload-types.ts and importMap.js are committed so typecheck and build need no
        # codegen step, and schema changes show up in review. Regenerating here proves the
        # committed copies match the config:
        #   - a stale types file lets a breaking field change typecheck clean
        #   - a stale import map builds fine and then fails at RUNTIME, when the admin
        #     cannot resolve a component it was told exists
        run: |
          pnpm run generate:types
          pnpm run generate:importmap
          git diff --exit-code src/payload-types.ts 'src/app/(payload)/admin/importMap.js'
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint (includes both Phase 0 guardrails)
        run: pnpm run lint

  test:
    name: unit + integration
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: static
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dd2
          POSTGRES_PASSWORD: dd2_ci
          POSTGRES_DB: dd2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dd2 -d dd2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://dd2:dd2_ci@localhost:5432/dd2_test
      # tests/setup/env.ts reads THIS, not DATABASE_URI, and overwrites DATABASE_URI with
      # it before the Payload config is evaluated. It deliberately refuses to inherit an
      # ambient DATABASE_URI, so that a local `pnpm test` can never point the isolation
      # suite — which truncates collections between runs — at a developer's dev database.
      # An environment that wants the integration tests to reach a database has to say so
      # explicitly, which is what this line does.
      TEST_DATABASE_URI: postgres://dd2:dd2_ci@localhost:5432/dd2_test
      PAYLOAD_SECRET: ci-only-not-a-real-secret
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (includes the guardrail suites)
        run: pnpm run test:unit
      - name: Integration tests
        # Includes the adversarial cross-tenant suite, which is the primary isolation
        # guarantee (`03` §6.4, `06` §2.2) rather than a secondary check. If this step is
        # not reaching Postgres, that guarantee is unenforced — it must fail loudly, never
        # be skipped.
        run: pnpm run test:integration

  components:
    name: component axe gate (Storybook, LTR + RTL)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [changes, test]
    if: needs.changes.outputs.components == 'true'
    # Playwright's own image: Chromium and every system library it needs are already in it, so
    # nothing is fetched from Ubuntu's package mirrors — which went unreachable from GitHub's
    # runners on 2026-11-11 and failed `playwright install --with-deps` three runs in a row. The
    # tag MUST match the pinned `@playwright/test`; bump them together.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    # No Postgres and no Next build: Storybook renders components in isolation. Keeping this
    # job independent of the database means a component regression is diagnosable on its own,
    # and it keeps working through phases where the page templates are still changing shape.
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: axe over every story, both directions (zero critical/serious to merge)
        # `06` §2.4 — every block registers its axe test in the same PR. Driven from
        # Storybook's story index, so a new story is in the gate the moment it exists.
        run: pnpm run test:a11y:components
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report-components
          path: playwright-report/
          retention-days: 7

  # The WHOLE e2e suite — not only `@smoke`. Smoke alone let a regression in a spec it does not
  # tag reach a PR (2026-11-12: `page-toolbar.spec.ts`, when the page header changed).
  #
  # ONE machine, TWO workers (Jason, 2026-11-17), in place of two shards that each installed,
  # built and seeded on their own: the same suite, one build instead of two. Two workers share
  # one `next start`; locally the suite runs at four. Pull requests only — a merge's PR ran it.
  e2e:
    name: build + e2e + axe gate
    runs-on: ubuntu-latest
    # The whole suite at two workers, after a build: ~10 minutes.
    timeout-minutes: 30
    needs: test
    if: github.event_name == 'pull_request'
    # Playwright's own image, for the reason the component job gives. Inside a container job
    # the Postgres service is reached by its name, `postgres`, not through a published port.
    container: mcr.microsoft.com/playwright:v1.62.1-noble
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dd2
          POSTGRES_PASSWORD: dd2_ci
          POSTGRES_DB: dd2_test
        options: >-
          --health-cmd "pg_isready -U dd2 -d dd2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://dd2:dd2_ci@postgres:5432/dd2_test
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
      # The admin plane needs a real session from Phase 3's paste normalizer onward, and
      # `scripts/seed.ts` creates no admin unless BOTH of these are set. That policy is not
      # relaxed here: no credential is committed for anyone to reuse, CI states its own.
      #
      # Inline rather than a repository secret, matching PAYLOAD_SECRET above and for the
      # same reason. This pair authenticates against a Postgres service container that is
      # created for this job and destroyed with the runner, is never reachable off it, and
      # grants nothing anywhere else. Putting it in the secret store would imply it guards
      # something, and would silently break CI on every fork.
      #
      # NOT a template for any deployed environment: real environments hold real staff
      # accounts and their secrets live in the platform secret store (`09` §1).
      #
      # The password must satisfy src/auth/password-policy.ts — 8+ characters, no banned
      # fragment ("admin", "district", "dd2", "password", ...) — or the seed step throws.
      SEED_ADMIN_EMAIL: ci-e2e@example.invalid
      SEED_ADMIN_PASSWORD: ci-ephemeral-runner-phrase
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tenant hostnames resolve to this machine
        # On a runner `*.localhost` resolves to loopback by itself (`06` §4); in a container
        # Chromium still does, but Node's own requests (the specs' API calls, the server's
        # readiness check) go through glibc, which does not. The image runs as root.
        run: echo '127.0.0.1 a.localhost b.localhost c.localhost unknown.localhost' >> /etc/hosts
      - name: Next's build cache
        # Next reuses its compile cache between builds. Keyed on the lockfile and the source, so a
        # change rebuilds only what it touched; the restore key starts from the nearest older one.
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Build
        run: pnpm run build
      - name: Seed tenants + the CI district admin
        # The public site resolves a tenant from the request Host and 404s an unknown one
        # by design (`02` §4.1), so without seeded tenants there is nothing to serve — the
        # server would not even pass Playwright's readiness check. `*.localhost` hostnames
        # resolve to loopback with no /etc/hosts entry (`06` §4).
        #
        # This is also the first time the admin path of the seed runs in CI. The admin-plane
        # specs fail rather than skip when the credentials are absent here
        # (tests/e2e/support/admin-session.ts) — a gate that silently stops covering the
        # admin plane while still reporting green is the failure mode being avoided.
        run: pnpm run seed
      - name: E2E + axe gate (zero critical/serious to merge)
        run: pnpm exec playwright test --workers=2
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  lighthouse:
    name: lighthouse budget
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, e2e]
    if: needs.changes.outputs.public == 'true'
    # Postgres and the seed step mirror the `e2e` job above, and for the same reason: the
    # public site resolves a tenant from the request Host and 404s an unknown one by design
    # (`02` §4.1). Without them `lhci` audited a 404 rendered outside `SiteLayout` — no
    # `<html lang>`, no page content — so the `07` §7 budget scored a page the site never
    # serves and had never measured the real thing.
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: dd2
          POSTGRES_PASSWORD: dd2_ci
          POSTGRES_DB: dd2_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U dd2 -d dd2_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URI: postgres://dd2:dd2_ci@localhost:5432/dd2_test
      PAYLOAD_SECRET: ci-only-not-a-real-secret
      NEXT_PUBLIC_SERVER_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Next's build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.*') }}
          restore-keys: next-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm run build
      - name: Seed tenants
        # `lighthouserc.json` audits `http://localhost:3000/`, and bare `localhost` is the
        # district tenant in the seed set. `lhci` starts the server itself, so this has to
        # land before `test:perf`, not inside it.
        run: pnpm run seed
      - name: Core Web Vitals + a11y budget
        run: pnpm run test:perf
      # The report stays inside the repo's access control. `lhci`'s default upload target is
      # Google's temporary PUBLIC storage — an unlisted but world-readable URL — which was
      # harmless for seeded content and would not be once real pages are audited.
      - name: Keep the Lighthouse report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/reports/
          retention-days: 14
          if-no-files-found: ignore

  # Dependency scanning per `06` §2.7. Payload version bumps are always a deliberate,
  # separate PR — never bundled with feature work (`09` §2).
  # Only when the lockfile can have changed on a PR, and weekly on the schedule (Jason,
  # 2026-11-17): an advisory against an unchanged lockfile is not a PR's to fix, and a weekly run
  # catches it without a full CI run on every merge.
  security:
    name: dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: changes
    if: needs.changes.outputs.deps == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with: { version: '${{ env.PNPM_VERSION }}' }
      - uses: actions/setup-node@v5
        with:
          node-version: '${{ env.NODE_VERSION }}'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm audit --audit-level high
